name: Build GateLink VPN APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'vpn-client/**'
      - '.github/workflows/build-vpn-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Install Android SDK Platform 37
        run: sdkmanager 'platforms;android-37' 'build-tools;36.0.0'

      - name: Run unit tests and build installable APK
        working-directory: vpn-client
        shell: bash
        run: |
          set +e
          set -o pipefail
          ./gradlew --no-daemon testDebugUnitTest assembleDebug 2>&1 | tee /tmp/gatelink-gradle-build.log
          build_status=$?
          if [ "$build_status" -ne 0 ]; then
            {
              echo '## Gradle build failure details'
              echo '```text'
              tail -n 120 /tmp/gatelink-gradle-build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            details=$(tail -n 80 /tmp/gatelink-gradle-build.log | tail -c 12000 | python3 -c 'import sys; print(sys.stdin.read().replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"), end="")')
            printf '::error title=Gradle%%20build%%20failure::%s\n' "$details"
            exit "$build_status"
          fi

      - name: Package APK with external notices and source
        working-directory: vpn-client
        run: |
          python3 scripts/package_distribution.py \
            --apk app/build/outputs/apk/debug/app-debug.apk \
            --out distribution/GateLinkVPN-Bundle.zip
          sha256sum app/build/outputs/apk/debug/app-debug.apk distribution/GateLinkVPN-Bundle.zip

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: GateLinkVPN-APK
          path: vpn-client/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90

      - name: Upload share bundle (APK + TXT notices + source)
        uses: actions/upload-artifact@v7
        with:
          name: GateLinkVPN-Bundle
          path: vpn-client/distribution/GateLinkVPN-Bundle.zip
          retention-days: 90
